# ESAP+ "noticias": reads the news of esap.edu.pt into the app's production
# and staging databases. The code stays in the private app repository: this
# only checks it out (ESAP_PLUS_TOKEN) and runs scripts/noticias there.
#
# Secrets: ESAP_PLUS_TOKEN, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID,
# SUPABASE_STAGING_PROJECT_ID (see README.md).
name: Notícias

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: noticias
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  fetch:
    name: Notícias do site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: uRyumasu/esap-plus
          token: ${{ secrets.ESAP_PLUS_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read the news into the databases
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NOTICIAS_PROJECTS: ${{ secrets.SUPABASE_PROJECT_ID }},${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: node scripts/noticias/noticias.mjs > /tmp/noticias.json

      # Administração → Estado dos dados (never fails the run)
      - name: Data status
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ESTADO_PROJECTS: ${{ secrets.SUPABASE_PROJECT_ID }},${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: node scripts/estado-dados/registar.mjs noticias ${{ job.status }} /tmp/noticias.json

      - name: Keep the schedule on
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/noticias.yml/enable"
