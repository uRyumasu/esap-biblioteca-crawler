# Reads the Águeda libraries' catalogue into the ESAP+ app (see ler.mjs).
#
# The app's database queues the records at 01:07 UTC (and every 2 hours on
# school days, the school's lent copies); these runs read the queue until it's
# empty. A run that finds nothing to do ends in seconds; a later run picks up
# what an earlier one couldn't finish (or a runner the OPAC refused).
#
# Secrets: BIBLIOTECA_URL, BIBLIOTECA_CHAVE.
name: Ler o catálogo

on:
  schedule:
    - cron: '17 1,3,5,7 * * *'
    - cron: '23 8-16/2 * * 1-5'
  workflow_dispatch:

# one reader at a time: the OPAC is the municipality's server
concurrency:
  group: ler
  cancel-in-progress: false

permissions:
  contents: read
  # to keep the schedule on (see the last step)
  actions: write

jobs:
  ler:
    name: Ler
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read the queue
        env:
          BIBLIOTECA_URL: ${{ secrets.BIBLIOTECA_URL }}
          BIBLIOTECA_CHAVE: ${{ secrets.BIBLIOTECA_CHAVE }}
        run: node ler.mjs

      # GitHub turns off the schedule of a public repository after 60 days
      # without commits; enabling the workflow again keeps it on.
      - name: Keep the schedule on
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ler.yml/enable"
