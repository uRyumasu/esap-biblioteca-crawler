# ESAP+ "exames": keeps web/src/features/exames/dados/exames.json (shipped with the app) up to date. The code
# stays in the private app repository: this checks it out (ESAP_PLUS_TOKEN)
# and runs scripts/exames/fetch.py there. If something changed, it opens (or updates) a PR
# on fix/exames-dados in uRyumasu/esap-plus. Merging it is a normal deploy.
#
# Secrets: ESAP_PLUS_TOKEN, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID,
# SUPABASE_STAGING_PROJECT_ID (see README.md).
name: Exames

on:
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

concurrency:
  group: exames
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  update:
    name: Calendário novo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: uRyumasu/esap-plus
          token: ${{ secrets.ESAP_PLUS_TOKEN }}

      - name: Read the source
        id: fetch
        run: python3 scripts/exames/fetch.py --resumo /tmp/exames.md

      - name: Open or update the PR
        if: steps.fetch.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ secrets.ESAP_PLUS_TOKEN }}
          GH_REPO: uRyumasu/esap-plus
          BRANCH: fix/exames-dados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add web/src/features/exames/dados/exames.json
          git commit -q -m "fix(exames): calendário dos exames de $(jq -r .ano web/src/features/exames/dados/exames.json)"
          git push -f origin "$BRANCH"
          {
            echo 'O calendário dos exames do IAVE mudou, lido por `uRyumasu/esap-biblioteca-crawler` (`.github/workflows/exames.yml`).'
            echo
            cat /tmp/exames.md
            echo
            echo 'Ao juntar, a app Exames nacionais e o Calendário mostram as datas novas.'
          } > /tmp/body.md
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file /tmp/body.md
          else
            gh pr create --head "$BRANCH" --base main --title "Exames: calendário novo do IAVE" --body-file /tmp/body.md
          fi

      # Administração → Estado dos dados (never fails the run)
      - name: Data status
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ESTADO_PROJECTS: ${{ secrets.SUPABASE_PROJECT_ID }},${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: node scripts/estado-dados/registar.mjs exames ${{ job.status }} /tmp/exames.md

      - name: Keep the schedule on
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/exames.yml/enable"
