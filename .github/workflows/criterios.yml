# ESAP+ "criterios": keeps web/src/features/horario/dados/criterios.json (shipped with the app) up to date. The code
# stays in the private app repository: this checks it out (ESAP_PLUS_TOKEN)
# and runs scripts/criterios/fetch.py there. If something changed, it opens (or updates) a PR
# on fix/criterios-dados in uRyumasu/esap-plus. Merging it is a normal deploy.
#
# Secrets: ESAP_PLUS_TOKEN, SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID,
# SUPABASE_STAGING_PROJECT_ID (see README.md).
name: Critérios de avaliação

on:
  schedule:
    - cron: '53 5 * * 1'
  workflow_dispatch:

concurrency:
  group: criterios
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  update:
    name: Critérios novos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: uRyumasu/esap-plus
          token: ${{ secrets.ESAP_PLUS_TOKEN }}
      - run: pip install --quiet pdfplumber==0.11.10
      - name: Read the source
        id: fetch
        run: python3 scripts/criterios/fetch.py --resumo /tmp/criterios.md

      - name: Open or update the PR
        if: steps.fetch.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ secrets.ESAP_PLUS_TOKEN }}
          GH_REPO: uRyumasu/esap-plus
          BRANCH: fix/criterios-dados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add web/src/features/horario/dados/criterios.json
          git commit -q -m "fix(horario): critérios de avaliação novos da escola"
          git push -f origin "$BRANCH"
          {
            echo 'O Referencial de Avaliação do site da escola mudou, lido por `uRyumasu/esap-biblioteca-crawler` (`.github/workflows/criterios.yml`).'
            echo
            cat /tmp/criterios.md
            echo
            echo 'Ao juntar, o Horário mostra os pesos novos em «Como és avaliado».'
          } > /tmp/body.md
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file /tmp/body.md
          else
            gh pr create --head "$BRANCH" --base main --title "Horário: critérios de avaliação novos" --body-file /tmp/body.md
          fi

      # Administração → Estado dos dados (never fails the run)
      - name: Data status
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ESTADO_PROJECTS: ${{ secrets.SUPABASE_PROJECT_ID }},${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: node scripts/estado-dados/registar.mjs criterios ${{ job.status }} /tmp/criterios.md

      - name: Keep the schedule on
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/criterios.yml/enable"
